# /etc/systemd/system/greetd.service.d/i18n-es.conf
[Service]
# Parchea las revisiones ya extraídas (cache existente sin es.json).
ExecStartPre=-/etc/greetd/i18n/dms-greeter-es-apply.sh
# Espera a que se extraiga una revisión nueva y la parchea antes de que QML
# cargue las traducciones. Necesario tras actualizar dux-greeter-bin, porque en
# ese arranque la carpeta de la revisión nueva todavía no existe.
ExecStartPost=-/etc/greetd/i18n/dms-greeter-es-apply.sh --wait
