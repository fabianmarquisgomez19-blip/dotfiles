# /var/cache es un subvolumen btrfs propio, asi que systemd lo desmonta al
# apagar. En ese momento ya esta corriendo el plymouthd del splash de apagado
# (plymouth-reboot/poweroff), que carga la fuente del tema con Pango ->
# fontconfig, y fontconfig mapea /var/cache/fontconfig/*.cache-12. Un mmap
# mantiene el montaje ocupado: "umount" devuelve EBUSY (status=32) y el journal
# registra "Failed unmounting /var/cache" en cada apagado.
#
# umount -l lo desacopla igualmente; el sistema de ficheros se libera del todo
# cuando muere plymouthd, al final del apagado. Es cache, no hay datos en vuelo.
[Mount]
LazyUnmount=yes
