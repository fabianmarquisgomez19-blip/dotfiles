[Service]
# La UI embebida de dux-files se reextrae en cada arranque, así que el parche
# se aplica justo después de la extracción y antes de que QML cargue las
# traducciones (ver ~/.config/dux-files/i18n/dfiles-es-apply.sh --wait).
ExecStartPost=-%h/.config/dux-files/i18n/dfiles-es-apply.sh --wait
