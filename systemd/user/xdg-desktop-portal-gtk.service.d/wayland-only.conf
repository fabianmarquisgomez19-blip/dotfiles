# Evita que xdg-desktop-portal-gtk abra una conexión X11 (DISPLAY=:0).
#
# Motivo: el portal es una app GTK y al tener DISPLAY exportado conecta al
# socket X11 de niri; eso hace que niri lance xwayland-satellite en cada login
# (integración on-demand de niri >= 25.08) y que el portal muera con
# "Error reading events from display: Tubería rota" al cerrar sesión, dejando
# el fallo "Failed to start Portal service" tras el siguiente login.
#
# Con GDK_BACKEND=wayland el portal usa solo Wayland: no conecta a X, no muere
# al cerrar sesión y Xwayland/satellite solo arrancan cuando una app X real
# se conecta al socket.
[Service]
Environment=GDK_BACKEND=wayland
