# Mantiene despierto el sink Bluetooth (A2DP) para que los sonidos cortos
# de notificación no se pierdan mientras el enlace despierta.
# WirePlumber 0.5: el script suspend-node.lua suspende tras 5 s de inactividad
# salvo que session.suspend-timeout-seconds sea 0.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
